model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        identity_context_dim: 1024
        legacy: false
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: penultimate
      controlnet_cfg:
        use_checkpoint: true
        image_size: 32
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        legacy: false
      identity_projector_cfg:
        embedding_dim: 512
        hidden_dim: 1024
        context_dim: 1024
        num_tokens: 4

  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: nearest+conv
      resi_connection: 1conv
      unshuffle: true
      unshuffle_scale: 8

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: true
      parameterization: v

dataset:
  train:
    target: diffbir.dataset.codeformer.CodeformerDataset
    params:
      # Plain txt/list file. Each line is an absolute path to one aligned 512x512 training image.
      file_list:
      file_backend_cfg:
        target: diffbir.dataset.file_backend.HardDiskBackend
      out_size: 512
      crop_type: center
      blur_kernel_size: 41
      kernel_list: [iso, aniso]
      kernel_prob: [0.5, 0.5]
      blur_sigma: [1, 8]
      downsample_range: [4, 8]
      noise_range: [0, 12]
      jpeg_range: [30, 80]

batch_transform:
  target: diffbir.dataset.batch_transform.IdentityBatchTransform

train:
  sd_path:
  controlnet_path:
  swinir_path:
  identity_encoder_path:
  identity_resume:
  exp_dir:
  learning_rate: 5e-5
  batch_size: 1
  num_workers: 4
  train_steps: 6000
  ckpt_every: 1000
  identity_scale: 1.0
  noise_aug_timestep: 50
